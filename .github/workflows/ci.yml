name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: PyTorch (CPU) kur
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: KökLM kur
        run: pip install -e ".[dev,hf]"
      - name: Testler
        run: pytest -v
      - name: Parametre raporu
        run: python scripts/parametre_say.py 1B 8B
